<div class="admin-login-container">
  <div class="glass-box">
    <div class="logo">
      <h2><span class="highlight">Dcor</span> Studio</h2>
      <p class="subtitle">Hệ thống Quản trị & Điều hành</p>
    </div>

    <div class="error-message" *ngIf="error">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span>{{ error }}</span>
    </div>

    <form class="login-form" (ngSubmit)="handleLogin($event)">
      <div class="form-group">
        <label for="email">Email công việc</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
          <input id="email" name="email" [(ngModel)]="email" type="email" required placeholder="admin@dcor.vn" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="password" name="password" [(ngModel)]="password" type="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember-me">
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="mailto:admin@dcor.vn" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!email || !password || loading">
        <svg *ngIf="loading" class="spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
        {{ loading ? 'Đang xử lý...' : 'Đăng nhập hệ thống' }}
      </button>

      <p class="rule-hint">Tất cả nút hành động mặc định ở trạng thái Disabled.</p>
    </form>
  </div>
</div>
