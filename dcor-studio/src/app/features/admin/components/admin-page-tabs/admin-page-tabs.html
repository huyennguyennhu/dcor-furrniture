<div style="display: flex; gap: 24px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; overflow-x: auto;">
  <button
    *ngFor="let tab of tabs"
    type="button"
    (click)="onTabClick(tab.id)"
    [ngStyle]="{
      'background': 'none',
      'border': 'none',
      'border-bottom': activeTab === tab.id ? '2px solid var(--accent)' : '2px solid transparent',
      'padding': '12px 0',
      'cursor': 'pointer',
      'color': activeTab === tab.id ? 'var(--text-primary)' : 'var(--text-secondary)',
      'font-size': '14px',
      'font-weight': activeTab === tab.id ? 600 : 500,
      'display': 'flex',
      'align-items': 'center',
      'gap': '8px',
      'white-space': 'nowrap',
      'transition': 'all 0.2s'
    }"
  >
    {{ tab.label }}
    <span
      *ngIf="tab.count !== undefined"
      [ngStyle]="{
        'background': activeTab === tab.id ? 'var(--bg-tertiary)' : 'var(--bg-primary)',
        'color': activeTab === tab.id ? 'var(--accent)' : 'var(--text-muted)',
        'padding': '2px 8px',
        'border-radius': '12px',
        'font-size': '12px',
        'font-weight': 600,
        'border': activeTab === tab.id ? 'none' : '1px solid var(--border-color)'
      }"
    >
      {{ tab.count }}
    </span>
  </button>
</div>
