<header style="height: 80px; flex-shrink: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: relative; z-index: 10;">
  
  <!-- Left: Logo -->
  <div style="width: 250px;">
    <a routerLink="/admin/reports/overview" style="text-decoration: none;">
      <h2 style="margin: 0; font-size: 24px; font-family: var(--font-title); color: var(--text-primary);">
        D<span style="color: var(--accent);">'</span>Cor <span style="font-size: 14px; font-weight: 400; color: var(--text-muted);">Admin</span>
      </h2>
    </a>
  </div>

  <!-- Center: Search Bar -->
  <div style="flex-grow: 1; display: flex; justify-content: center;">
    <div class="search-bar" style="display: flex; align-items: center; background: var(--bg-secondary); padding: 8px 16px; border-radius: 24px; width: 400px; max-width: 100%;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--text-muted)" style="margin-right: 8px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input 
        type="text" 
        placeholder="Tìm kiếm chức năng..." 
        style="border: none; background: none; outline: none; font-size: 14px; width: 100%; color: var(--text-primary);"
      />
    </div>
  </div>

  <!-- Right: Actions -->
  <div style="display: flex; align-items: center; gap: 24px; width: 250px; justify-content: flex-end;">
    <button style="background: none; border: none; cursor: pointer; position: relative; color: var(--text-secondary);">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span style="position: absolute; top: -4px; right: -4px; background: var(--accent); color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">3</span>
    </button>

    <div style="height: 24px; width: 1px; background: var(--border-color);"></div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary); overflow: hidden;">
        <img src="https://ui-avatars.com/api/?name=Admin&background=111111&color=fff" alt="Admin Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
      </div>
      <div style="display: flex; flex-direction: column; text-align: left;">
        <span style="font-size: 14px; font-weight: 600; color: var(--text-primary);">Admin User</span>
        <span style="font-size: 12px; color: var(--text-muted);">Super Admin</span>
      </div>
    </div>

    <button 
      (click)="handleLogout()"
      style="background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center;"
      title="Đăng xuất"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    </button>
  </div>
</header>
