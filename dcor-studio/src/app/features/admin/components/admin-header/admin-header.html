<header style="height: 60px; flex-shrink: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(59, 40, 25, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: relative; z-index: 10;">
  
  <!-- Left: Logo -->
  <div style="width: 220px; display: flex; align-items: center;">
    <a routerLink="/admin/reports/overview" style="text-decoration: none;">
      <img src="/assets/favicon/logo.png" alt="DCor" width="88" height="40" style="display: block; width: 88px; height: 40px; object-fit: contain;" />
    </a>
  </div>

  <!-- Center: Search Bar -->
  <div style="flex-grow: 1; display: flex; justify-content: center;">
    <div class="search-bar" style="display: flex; align-items: center; background: var(--bg-secondary); padding: 8px 16px; border-radius: 24px; width: 400px; max-width: 100%;">
      <app-icon name="Search" size="16" style="margin-right: 8px;" color="var(--text-muted)"></app-icon>
      <input 
        type="text" 
        placeholder="Tìm kiếm chức năng..." 
        style="border: none; background: none; outline: none; font-size: 14px; width: 100%; color: var(--text-primary);"
      />
    </div>
  </div>

  <!-- Right: Actions -->
  <div class="header-actions">
    <div class="notif-menu">
      <button
        type="button"
        class="notif-trigger-btn"
        [class.open]="isNotifMenuOpen"
        [attr.aria-expanded]="isNotifMenuOpen"
        aria-label="Thông báo quản trị"
        (click)="toggleNotifMenu($event)">
        <app-icon name="Bell" size="20"></app-icon>
        <span *ngIf="totalNotifications() > 0" class="notif-badge">
          {{ totalNotifications() > 99 ? '99+' : totalNotifications() }}
        </span>
      </button>

      <div *ngIf="isNotifMenuOpen" class="notif-dropdown" role="menu">
        <div class="notif-dropdown-header">
          <span>Thông báo mới</span>
          <span class="notif-header-count" *ngIf="totalNotifications() > 0">{{ totalNotifications() }}</span>
        </div>

        <button
          *ngIf="adminConsultationService.pendingCount() > 0"
          type="button"
          class="notif-item"
          (click)="openNotificationsTarget('/admin/appointments/requests')">
          <span class="notif-item-icon consult">
            <app-icon name="CalendarDays" size="16"></app-icon>
          </span>
          <span class="notif-item-content">
            <span class="notif-item-title">Yêu cầu tư vấn chờ duyệt</span>
            <span class="notif-item-desc">Có <strong>{{ adminConsultationService.pendingCount() }}</strong> yêu cầu tư vấn mới từ khách hàng</span>
          </span>
          <span class="notif-item-pill">{{ adminConsultationService.pendingCount() > 99 ? '99+' : adminConsultationService.pendingCount() }}</span>
        </button>

        <button
          *ngIf="chatUnreadService.totalUnread() > 0"
          type="button"
          class="notif-item"
          (click)="openNotificationsTarget('/admin/chat')">
          <span class="notif-item-icon chat">
            <app-icon name="MessagesSquare" size="16"></app-icon>
          </span>
          <span class="notif-item-content">
            <span class="notif-item-title">Tin nhắn khách hàng</span>
            <span class="notif-item-desc">Có <strong>{{ chatUnreadService.totalUnread() }}</strong> tin nhắn chưa đọc</span>
          </span>
          <span class="notif-item-pill">{{ chatUnreadService.totalUnread() > 99 ? '99+' : chatUnreadService.totalUnread() }}</span>
        </button>

        <div *ngIf="totalNotifications() === 0" class="notif-empty">
          Hiện chưa có thông báo mới nào.
        </div>
      </div>
    </div>

    <div style="height: 24px; width: 1px; background: var(--border-color);"></div>

    <div class="account-menu">
      <button
        type="button"
        class="account-menu-trigger"
        [class.open]="isAccountMenuOpen"
        [attr.aria-expanded]="isAccountMenuOpen"
        aria-haspopup="menu"
        (click)="toggleAccountMenu($event)">
        <app-icon name="CircleUserRound" size="36"></app-icon>
        <span class="account-label">
          <span class="account-name">{{ (currentUser$ | async)?.fullName || 'Admin User' }}</span>
          <span class="account-role">{{ (currentUser$ | async)?.role || 'Super Admin' }}</span>
        </span>
        <app-icon
          class="account-chevron"
          name="ChevronDown"
          size="18"
          [style.transform]="isAccountMenuOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></app-icon>
      </button>

      <div *ngIf="isAccountMenuOpen" class="account-dropdown" role="menu">
        <button
          type="button"
          class="logout-menu-item"
          role="menuitem"
          (click)="handleLogout()">
          <app-icon name="LogOut" size="20"></app-icon>
          <span>Đăng xuất</span>
        </button>
      </div>
    </div>
  </div>
</header>
