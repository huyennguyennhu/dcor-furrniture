<header style="height: 60px; flex-shrink: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(59, 40, 25, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: relative; z-index: 10;">
  
  <!-- Left: Logo -->
  <div style="width: 220px; display: flex; align-items: center;">
    <a routerLink="/admin/reports/overview" style="text-decoration: none;">
      <img src="/assets/favicon/logo.png" alt="DCor" width="88" height="40" style="display: block; width: 88px; height: 40px; object-fit: contain;" />
    </a>
  </div>

  <!-- Center: Search Bar -->
  <div style="flex-grow: 1; display: flex; justify-content: center;">
    <div class="search-bar" style="display: flex; align-items: center; background: var(--bg-secondary); padding: 8px 16px; border-radius: 24px; width: 400px; max-width: 100%;">
      <app-icon name="Search" size="16" style="margin-right: 8px;" color="var(--text-muted)"></app-icon>
      <input 
        type="text" 
        placeholder="Tìm kiếm chức năng..." 
        style="border: none; background: none; outline: none; font-size: 14px; width: 100%; color: var(--text-primary);"
      />
    </div>
  </div>

  <!-- Right: Actions -->
  <div class="header-actions">
    <div class="notif-menu">
      <button
        type="button"
        class="notif-trigger-btn"
        [class.open]="isNotifMenuOpen"
        [attr.aria-expanded]="isNotifMenuOpen"
        aria-label="Thông báo quản trị"
        (click)="toggleNotifMenu($event)">
        <app-icon name="Bell" size="20"></app-icon>
        <span *ngIf="unseenCount > 0" class="notif-badge">
          {{ unseenCount > 99 ? '99+' : unseenCount }}
        </span>
      </button>

      <div *ngIf="isNotifMenuOpen" class="notif-dropdown" role="menu" (click)="$event.stopPropagation()">
        <!-- Header -->
        <div class="notif-dropdown-header">
          <div class="notif-header-left">
            <span>Thông báo quản trị</span>
            <span class="notif-header-count" *ngIf="unseenCount > 0">{{ unseenCount }}</span>
          </div>
          <!-- <button
            *ngIf="activeNotifTab === 'UNSEEN' && unseenCount > 0"
            type="button"
            class="notif-mark-all-btn"
            (click)="markAllAsSeen($event)">
            Đọc tất cả
          </button> -->
        </div>

        <!-- 2 Tabs: Chưa xem | Đã xem -->
        <div class="notif-tabs-bar">
          <button
            type="button"
            class="notif-tab-btn"
            [class.active]="activeNotifTab === 'UNSEEN'"
            (click)="setNotifTab('UNSEEN', $event)">
            <span>Chưa xem</span>
            <span class="notif-tab-badge">{{ unseenCount }}</span>
          </button>
          <button
            type="button"
            class="notif-tab-btn"
            [class.active]="activeNotifTab === 'SEEN'"
            (click)="setNotifTab('SEEN', $event)">
            <span>Đã xem</span>
            <span class="notif-tab-badge seen">{{ seenCount }}</span>
          </button>
        </div>

        <!-- Bộ lọc Nghiệp vụ theo tên tab cha -->
        <div class="notif-module-filters">
          <button
            *ngFor="let mod of NOTIF_MODULES"
            type="button"
            class="notif-filter-chip"
            [class.active]="selectedNotifModule === mod"
            (click)="setNotifModule(mod, $event)">
            {{ mod === 'ALL' ? 'Tất cả' : mod }}
          </button>
        </div>

        <!-- Danh sách thông báo (mới -> cũ nhất, màu theo từng trang) -->
        <div class="notif-list-scroll" *ngIf="filteredNotifications.length > 0; else emptyNotifTpl">
          <div
            *ngFor="let item of filteredNotifications"
            class="notif-item"
            [ngClass]="['source-' + item.sourceKey, item.isSeen ? 'is-seen' : 'is-unseen']"
            (click)="onNotifClick(item)">
            <span class="notif-item-icon" [ngClass]="item.sourceKey">
              <app-icon [name]="item.icon" size="16"></app-icon>
            </span>

            <div class="notif-item-content">
              <div class="notif-item-top-row">
                <span class="notif-source-tag" [ngClass]="item.sourceKey">{{ item.sourcePage }}</span>
                <span class="notif-item-time">{{ formatRelativeTime(item.createdAt) }}</span>
              </div>
              <span class="notif-item-title">{{ item.title }}</span>
              <span class="notif-item-desc">{{ item.desc }}</span>
            </div>

            <button
              *ngIf="!item.isSeen"
              type="button"
              class="notif-mark-read-dot"
              title="Đánh dấu đã xem"
              (click)="markAsSeen(item, $event)">
            </button>
          </div>
        </div>

        <ng-template #emptyNotifTpl>
          <div class="notif-empty">
            {{ activeNotifTab === 'UNSEEN' ? 'Không có thông báo chưa xem nào.' : 'Chưa có thông báo nào đã xem.' }}
          </div>
        </ng-template>
      </div>
    </div>

    <div style="height: 24px; width: 1px; background: var(--border-color);"></div>

    <div class="account-menu">
      <button
        type="button"
        class="account-menu-trigger"
        [class.open]="isAccountMenuOpen"
        [attr.aria-expanded]="isAccountMenuOpen"
        aria-haspopup="menu"
        (click)="toggleAccountMenu($event)">
        <app-icon name="CircleUserRound" size="36"></app-icon>
        <span class="account-label">
          <span class="account-name">{{ (currentUser$ | async)?.fullName || 'Admin User' }}</span>
          <span class="account-role">{{ (currentUser$ | async)?.role || 'Super Admin' }}</span>
        </span>
        <app-icon
          class="account-chevron"
          name="ChevronDown"
          size="18"
          [style.transform]="isAccountMenuOpen ? 'rotate(180deg)' : 'rotate(0deg)'"></app-icon>
      </button>

      <div *ngIf="isAccountMenuOpen" class="account-dropdown" role="menu">
        <button
          type="button"
          class="logout-menu-item"
          role="menuitem"
          (click)="handleLogout()">
          <app-icon name="LogOut" size="20"></app-icon>
          <span>Đăng xuất</span>
        </button>
      </div>
    </div>
  </div>
</header>
