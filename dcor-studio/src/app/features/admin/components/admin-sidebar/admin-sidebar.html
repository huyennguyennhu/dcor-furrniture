<aside class="admin-sidebar" [class.collapsed]="isCollapsed">
  <!-- Nút < thu gọn/mở rộng ở lề phải sidebar, cách header 1cm -->
  <button
    type="button"
    class="sidebar-edge-toggle"
    (click)="toggleCollapse.emit()"
    [attr.aria-expanded]="!isCollapsed"
    [attr.aria-label]="isCollapsed ? 'Mở thanh điều hướng' : 'Thu gọn thanh điều hướng'"
    [title]="isCollapsed ? 'Mở thanh điều hướng' : 'Thu gọn thanh điều hướng'">
    <app-icon [name]="isCollapsed ? 'ChevronRight' : 'ChevronLeft'" size="14"></app-icon>
  </button>

  <div class="sidebar-navigation">
    <nav class="sidebar-menu" aria-label="Điều hướng quản trị">
      <div
        *ngFor="let item of MENU_ITEMS"
        class="sidebar-entry"
        (mouseenter)="handleMouseEnter($event, item.href)"
        (mouseleave)="handleMouseLeave()">
        <ng-container *ngIf="item.subItems; else directLink">
          <div class="sidebar-parent-link">
            <a
              class="sidebar-link"
              [class.active]="isParentActive(item)"
              [routerLink]="item.href"
              [attr.aria-label]="isCollapsed ? item.title : null"
              [title]="isCollapsed ? item.title : null"
              (click)="selectMenu(item.href)">
              <app-icon [name]="item.icon" size="18"></app-icon>
              <span class="sidebar-label" *ngIf="!isCollapsed">{{ item.title }}</span>
            </a>
            <button
              *ngIf="!isCollapsed"
              class="sidebar-link-toggle"
              [class.active]="isParentActive(item)"
              [attr.aria-label]="(openMenu === item.href ? 'Thu gọn ' : 'Mở rộng ') + item.title"
              [attr.aria-expanded]="openMenu === item.href"
              (click)="toggleMenu(item.href)">
              <app-icon
                [name]="openMenu === item.href ? 'ChevronDown' : 'ChevronRight'"
                size="16"></app-icon>
            </button>
          </div>
        </ng-container>

        <ng-template #directLink>
          <a
            class="sidebar-link"
            [class.active]="isParentActive(item)"
            [routerLink]="item.href"
            [attr.aria-label]="isCollapsed ? item.title : null"
            [title]="isCollapsed ? item.title : null">
            <app-icon [name]="item.icon" size="18"></app-icon>
            <span class="sidebar-label" *ngIf="!isCollapsed">{{ item.title }}</span>
          </a>
        </ng-template>

        <div
          *ngIf="!isCollapsed && item.subItems && openMenu === item.href"
          class="sidebar-submenu">
          <a
            *ngFor="let sub of item.subItems"
            class="admin-sub-item"
            [class.active]="sub.href === activeHref"
            [routerLink]="sub.href">
            {{ sub.title }}
          </a>
        </div>

        <div
          *ngIf="isCollapsed && hoveredMenu?.href === item.href && item.subItems"
          class="sidebar-hover-menu"
          [style.top.px]="hoveredMenu?.top"
          (mouseenter)="handleDropdownMouseEnter()"
          (mouseleave)="handleDropdownMouseLeave()">
          <div class="sidebar-hover-title">
            <app-icon [name]="item.icon" size="18"></app-icon>
            {{ item.title }}
          </div>
          <a
            *ngFor="let sub of item.subItems"
            class="admin-sub-item"
            [class.active]="sub.href === activeHref"
            [routerLink]="sub.href"
            (click)="closeHoveredMenu()">
            {{ sub.title }}
          </a>
        </div>
      </div>
    </nav>
  </div>

  <nav class="sidebar-footer" aria-label="Ajustes">
    <a
      class="sidebar-link"
      [class.active]="SETTINGS_ITEM.href === activeHref"
      [routerLink]="SETTINGS_ITEM.href"
      [attr.aria-label]="isCollapsed ? SETTINGS_ITEM.title : null"
      [title]="isCollapsed ? SETTINGS_ITEM.title : null">
      <app-icon [name]="SETTINGS_ITEM.icon" size="18"></app-icon>
      <span class="sidebar-label" *ngIf="!isCollapsed">{{ SETTINGS_ITEM.title }}</span>
    </a>
  </nav>
</aside>
