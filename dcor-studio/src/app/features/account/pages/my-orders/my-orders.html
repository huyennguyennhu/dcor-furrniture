<div class="account-page">
  <div class="container" style="display: flex; gap: 40px; padding: 40px 0;">
    
    <!-- Sidebar Account -->
    <div style="width: 250px; flex-shrink: 0;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">Tài khoản</h2>
      <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px;">
        <li><a routerLink="/account/profile" style="color: var(--text-secondary); text-decoration: none;">Hồ sơ cá nhân</a></li>
        <li><a routerLink="/account/orders" style="color: var(--accent); font-weight: 600; text-decoration: none;">Đơn hàng của tôi</a></li>
        <li><a routerLink="/account/wishlist" style="color: var(--text-secondary); text-decoration: none;">Sản phẩm yêu thích</a></li>
        <li><a style="color: #E74C3C; text-decoration: none; cursor: pointer; margin-top: 20px; display: inline-block;">Đăng xuất</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div style="flex-grow: 1;">
      <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 30px;">Đơn hàng của tôi</h1>

      <div *ngIf="orders.length === 0" style="text-align: center; padding: 60px; background: var(--bg-secondary); border-radius: 12px; border: 1px dashed var(--border-color);">
        <p style="color: var(--text-muted); margin-bottom: 20px;">Bạn chưa có đơn hàng nào.</p>
        <a routerLink="/" class="cta-btn" style="text-decoration: none; display: inline-block;">Mua sắm ngay</a>
      </div>

      <div *ngIf="orders.length > 0" style="display: flex; flex-direction: column; gap: 20px;">
        <div *ngFor="let order of orders" style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: 700; font-size: 16px; margin-bottom: 8px;">Mã đơn: {{ order.id }}</div>
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 4px;">Ngày đặt: {{ order.date }}</div>
            <div style="font-size: 14px; color: var(--text-secondary);">Số lượng sản phẩm: {{ order.items }}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 8px;">{{ formatCurrency(order.total) }}</div>
            <div [style.color]="getStatusColor(order.status)" style="font-size: 14px; font-weight: 600;">{{ order.status }}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
