<div class="account-page">
  <div class="container" style="display: flex; gap: 40px; padding: 40px 0;">
    
    <!-- Sidebar Account -->
    <div style="width: 250px; flex-shrink: 0;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">Tài khoản</h2>
      <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px;">
        <li><a routerLink="/account/profile" style="color: var(--accent); font-weight: 600; text-decoration: none;">Hồ sơ cá nhân</a></li>
        <li><a routerLink="/account/orders" style="color: var(--text-secondary); text-decoration: none;">Đơn hàng của tôi</a></li>
        <li><a routerLink="/account/wishlist" style="color: var(--text-secondary); text-decoration: none;">Sản phẩm yêu thích</a></li>
        <li><a style="color: #E74C3C; text-decoration: none; cursor: pointer; margin-top: 20px; display: inline-block;">Đăng xuất</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div style="flex-grow: 1;">
      <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 30px;">Hồ sơ cá nhân</h1>

      <div style="max-width: 600px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px;">
        <form (submit)="saveProfile(); $event.preventDefault()" style="display: flex; flex-direction: column; gap: 20px;">
          
          <div>
            <label style="display: block; font-size: 14px; margin-bottom: 8px;">Họ và tên</label>
            <input type="text" [(ngModel)]="fullName" name="fullName" class="auth-input" />
          </div>

          <div>
            <label style="display: block; font-size: 14px; margin-bottom: 8px;">Số điện thoại</label>
            <input type="tel" [(ngModel)]="phone" name="phone" class="auth-input" />
          </div>

          <div>
            <label style="display: block; font-size: 14px; margin-bottom: 8px;">Email</label>
            <input type="email" [(ngModel)]="email" name="email" class="auth-input" />
          </div>

          <div>
            <label style="display: block; font-size: 14px; margin-bottom: 8px;">Địa chỉ giao hàng mặc định</label>
            <textarea [(ngModel)]="address" name="address" class="auth-input" style="height: 80px; resize: none;"></textarea>
          </div>

          <button type="submit" class="cta-btn" style="width: fit-content;">Lưu thay đổi</button>

          <div *ngIf="successMessage" style="color: #2ECC71; font-size: 14px; margin-top: 10px;">{{ successMessage }}</div>
        </form>
      </div>
    </div>

  </div>
</div>
