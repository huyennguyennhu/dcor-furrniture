<div style="display: flex; flex-direction: column; min-height: 100vh;">
  <app-header></app-header>
  <main style="flex-grow: 1;" [style.padding-top]="!isHomePage ? 'var(--header-height)' : '0'">
    <router-outlet></router-outlet>
  </main>
  <app-footer *ngIf="!isAccountPage"></app-footer>

  <!-- Nút Cuộn Về Đầu Trang Toàn Cục (Global Back to Top Button - Ẩn trên Account Dashboard) -->
  <button type="button" class="btn-back-to-top" [class.visible]="showScrollTop && !isAccountPage"
    [class.dock-active]="isDockActive" (click)="scrollToTop()" aria-label="Về đầu trang" title="Về đầu trang">
    <app-icon name="ArrowUp" size="20" color="#ffffff"></app-icon>
  </button>

  <!-- Thanh So Sánh Nổi Toàn Cục (Đồng bộ giữa Explore và Product Detail) -->
  <app-floating-compare-dock></app-floating-compare-dock>

  <!-- Drawer Xem Nhanh Sản Phẩm Toàn Cục (Global Quick View Drawer) -->
  <app-quick-view-drawer
    [product]="(quickViewService.product$ | async)"
    [isOpen]="(quickViewService.isOpen$ | async) ?? false"
    (onClose)="quickViewService.close()">
  </app-quick-view-drawer>

  <!-- Khung Chat Trực Tuyến Hỗ Trợ Khách Hàng -->
  <app-chat-widget />
</div>
