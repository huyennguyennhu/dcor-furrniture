<div 
  class="card-image-area"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  style="position: relative;"
>
  <img *ngFor="let img of validImages; let idx = index"
       class="img-slider-item"
       [src]="img"
       [alt]="altText"
       [attr.loading]="idx === 0 ? 'lazy' : 'eager'"
       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; padding: 12px; transition: opacity 0.6s ease-in-out;"
       [ngStyle]="{
         'opacity': currentIndex === idx ? 1 : 0,
         'z-index': currentIndex === idx ? 1 : 0
       }"
  />

  <div class="product-badges" style="z-index: 10;">
    <span *ngIf="onSale" class="badge-tag badge-sale">
      {{ formattedDiscount }}
    </span>
    <span *ngIf="!onSale && isBestSeller" class="badge-tag badge-bestseller">
      Bán chạy
    </span>
    <span *ngIf="!onSale && !isBestSeller && isNew" class="badge-tag badge-new">
      Mới
    </span>
  </div>
</div>
