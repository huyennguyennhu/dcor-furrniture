<div class="cart-drawer-overlay" [class.active]="isOpen" (click)="closeDrawer()">
  <div class="cart-drawer" (click)="$event.stopPropagation()" style="flex-direction: column; display: flex; height: 100%;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
      <h2 style="margin: 0; font-size: 24px; font-weight: 700; color: var(--text-primary);">Giỏ hàng</h2>
      <button (click)="closeDrawer()" class="icon-btn" style="background: none; border: none; cursor: pointer; color: var(--text-primary);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- Body -->
    <div style="flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 20px;">
      <div *ngIf="cartItems.length === 0" style="text-align: center; padding: 40px 20px;">
        <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 20px;">Giỏ hàng của bạn đang rỗng.</p>
        <button (click)="closeDrawer()" class="cta-btn" style="background: var(--text-primary); color: var(--bg-primary); padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; font-weight: 600;">Tiếp tục mua sắm</button>
      </div>

      <div *ngFor="let gItem of cartItems; let idx = index" style="display: flex; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
        <div style="width: 80px; height: 80px; background: var(--bg-tertiary); border-radius: 8px; padding: 5px; cursor: pointer;" [routerLink]="['/kham-pha', gItem.productId]" (click)="closeDrawer()">
          <img [src]="gItem.image" [alt]="gItem.name" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <h4 [routerLink]="['/kham-pha', gItem.productId]" (click)="closeDrawer()" style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); cursor: pointer; max-width: 85%;">{{ gItem.name }}</h4>
              <button (click)="removeFromCart(idx)" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            
            <div *ngIf="gItem.variantTags && gItem.variantTags.length > 0" style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
              <span *ngFor="let tag of gItem.variantTags; let isLast = last">{{ tag.value }}{{ !isLast ? ' | ' : '' }}</span>
            </div>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <div style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; background: var(--bg-tertiary);">
              <button (click)="updateQuantity(idx, gItem.quantity - 1)" style="padding: 4px 10px; background: transparent; border: none; cursor: pointer; color: var(--text-primary); font-weight: bold;">-</button>
              <span style="font-size: 13px; min-width: 20px; text-align: center; color: var(--text-primary);">{{ gItem.quantity }}</span>
              <button (click)="updateQuantity(idx, gItem.quantity + 1)" style="padding: 4px 10px; background: transparent; border: none; cursor: pointer; color: var(--text-primary); font-weight: bold;">+</button>
            </div>
            <div style="font-weight: 700; color: var(--accent); font-size: 15px;">{{ formatCurrency(gItem.price * gItem.quantity) }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="cartItems.length > 0" style="padding-top: 20px; border-top: 1px solid var(--border-color); margin-top: auto;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-secondary);">
        <span>Tạm tính ({{ totalItemsCount }} sản phẩm)</span>
        <span>{{ formatCurrency(subTotal) }}</span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 16px; font-weight: 700; color: var(--text-primary);">
        <span>Tổng cộng</span>
        <span style="color: var(--accent); font-size: 18px;">{{ formatCurrency(totalAmount) }}</span>
      </div>
      <button (click)="goToCheckout()" style="width: 100%; background: var(--accent); color: #fff; padding: 14px; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(183, 121, 83, 0.3);">
        Tiến hành thanh toán
      </button>
    </div>

  </div>
</div>
