<aside class="sidebar-filter-wrapper">
  <div class="sidebar-filter-content">
    
    <!-- Top Header: Bộ lọc + Số lượng sản phẩm -->
    <div class="sidebar-header-row">
      <h3 class="sidebar-title">Bộ lọc</h3>
      <span class="product-count-text" *ngIf="productCount > 0">{{ productCount }} Sản phẩm</span>
    </div>
    
    <!-- 1. Danh mục chính trong database -->
    <div class="filter-section section-categories">
      <h4 class="section-plain-title">Danh mục</h4>
      <div class="category-link-list">
        <button 
          type="button" 
          class="cat-link-btn" 
          [class.active]="isCatActive('all')"
          (click)="selectCategory('all')">
          Tất cả
        </button>
        <button 
          type="button" 
          class="cat-link-btn" 
          *ngFor="let cat of displayCategories" 
          [class.active]="isCatActive(cat.key)"
          (click)="selectCategory(cat.key)">
          {{ cat.label }}
        </button>
      </div>
    </div>

    <!-- 2. Khoảng giá (VNĐ) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('price')">
        <h4>Khoảng giá (VNĐ)</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['price'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['price']">
        <div class="price-slider-container">
          <!-- Dual Range Slider (2 phía Min và Max) -->
          <div class="dual-range-wrapper">
            <div class="slider-track-bar"></div>
            <div class="slider-range-highlight" [style.left.%]="minPercent" [style.right.%]="100 - maxPercent"></div>
            <input 
              type="range" 
              [min]="0" 
              [max]="dynamicMaxPrice" 
              [step]="500000" 
              [(ngModel)]="localMinPrice" 
              (input)="onMinSliderInput()" 
              (change)="handlePriceChangeEnd()"
              (touchend)="handlePriceChangeEnd()"
              [style.z-index]="localMinPrice > (dynamicMaxPrice / 2) ? 5 : 3"
              class="range-input range-input-min"
              aria-label="Giá tối thiểu">
            <input 
              type="range" 
              [min]="0" 
              [max]="dynamicMaxPrice" 
              [step]="500000" 
              [(ngModel)]="localMaxPrice" 
              (input)="onMaxSliderInput()" 
              (change)="handlePriceChangeEnd()"
              (touchend)="handlePriceChangeEnd()"
              [style.z-index]="localMinPrice > (dynamicMaxPrice / 2) ? 3 : 5"
              class="range-input range-input-max"
              aria-label="Giá tối đa">
          </div>

          <!-- Ô nhập giá thủ công 2 phía -->
          <div class="price-inputs-row">
            <div class="price-input-col">
              <label class="price-input-sublabel">Tối thiểu</label>
              <div class="price-input-box">
                <input 
                  type="text" 
                  class="price-manual-input"
                  [value]="formatPriceOnlyNumber(localMinPrice)"
                  (focus)="onInputFocus($event)"
                  (blur)="onMinInputBlur($event)"
                  (keydown.enter)="onMinInputEnter($event)"
                  placeholder="0">
                <span class="price-currency-suffix">đ</span>
              </div>
            </div>

            <span class="price-sep-dash">-</span>

            <div class="price-input-col">
              <label class="price-input-sublabel">Tối đa</label>
              <div class="price-input-box">
                <input 
                  type="text" 
                  class="price-manual-input"
                  [value]="formatPriceOnlyNumber(localMaxPrice)"
                  (focus)="onInputFocus($event)"
                  (blur)="onMaxInputBlur($event)"
                  (keydown.enter)="onMaxInputEnter($event)"
                  placeholder="100.000.000">
                <span class="price-currency-suffix">đ</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Phòng (slug room) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('room')">
        <h4>Phòng</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['room'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['room']">
        <label 
          class="filter-radio-item" 
          *ngFor="let r of ROOM_OPTIONS"
          (click)="$event.preventDefault(); selectRoom(r.slug)">
          <input 
            type="radio" 
            name="sidebar_filter_room"
            class="radio-input-hidden" 
            [checked]="isRoomActive(r.slug)">
          <span class="custom-radio-circle" [class.checked]="isRoomActive(r.slug)"></span>
          <span class="filter-label-text">{{ r.name }}</span>
        </label>
      </div>
    </div>

    <!-- 4. Phong cách thiết kế (slug style) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('style')">
        <h4>Phong cách thiết kế</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['style'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['style']">
        <label class="filter-checkbox-label" *ngFor="let s of STYLE_OPTIONS">
          <input 
            type="checkbox" 
            class="filter-checkbox" 
            [checked]="filters.styles?.includes(s.slug)" 
            (change)="handleCheckboxChange('styles', s.slug)">
          <span class="filter-checkbox-custom"></span>
          <span class="filter-checkbox-text">{{ s.name }}</span>
        </label>
      </div>
    </div>

    <!-- 5. Đánh giá (Data thật tính từ các sản phẩm) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('rating')">
        <h4>Đánh giá</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['rating'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['rating']">
        <div 
          class="rating-filter-row" 
          *ngFor="let stars of [5, 4, 3, 2]" 
          (click)="selectRating(stars)"
          [class.active]="filters.minRating === stars">
          <span class="custom-radio-circle" [class.checked]="filters.minRating === stars"></span>
          <div class="stars-visual">
            <lucide-angular 
              *ngFor="let s of [1,2,3,4,5]" 
              [img]="icons.Star" 
              size="15" 
              class="star-item" 
              [class.filled]="s <= stars">
            </lucide-angular>
          </div>
          <span class="rating-count-num">{{ ratingCounts[stars] || 0 }}</span>
        </div>
      </div>
    </div>

    <!-- 6. Bảng màu sắc thật từ Database (Có phân trang) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('color')">
        <h4>Bảng màu sắc</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['color'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['color']">
        <div class="color-swatches-grid">
          <button 
            type="button" 
            class="swatch-circle-btn" 
            *ngFor="let c of currentColors" 
            [style.background-color]="c.hex" 
            [class.active]="isColorActive(c.slug)"
            [title]="c.name"
            (click)="selectColor(c.slug)">
            <lucide-angular *ngIf="isColorActive(c.slug)" [img]="icons.Check" size="12" [color]="c.hex === '#F8F8F8' ? '#000' : '#fff'"></lucide-angular>
          </button>
        </div>

        <!-- Phân trang màu sắc khi nhiều màu -->
        <div *ngIf="totalColorPages > 1" class="filter-pager-row">
          <button [disabled]="colorPage === 0" (click)="colorPage = colorPage - 1">&lt;</button>
          <span>{{ colorPage + 1 }} / {{ totalColorPages }}</span>
          <button [disabled]="colorPage >= totalColorPages - 1" (click)="colorPage = colorPage + 1">&gt;</button>
        </div>
      </div>
    </div>

    <!-- 7. Chất liệu thật từ Database (Có tìm kiếm & phân trang) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('material')">
        <h4>Chất liệu</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16" [ngStyle]="{'transform': expanded['material'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['material']">
        <div class="material-search-wrap">
          <input 
            type="text" 
            class="material-search-input" 
            placeholder="Tìm kiếm chất liệu..." 
            [(ngModel)]="materialSearchQuery" 
            (input)="materialPage = 0">
        </div>
        
        <label class="filter-checkbox-label" *ngFor="let m of currentMaterials">
          <input 
            type="checkbox" 
            class="filter-checkbox" 
            [checked]="filters.materials.includes(m)" 
            (change)="handleCheckboxChange('materials', m)">
          <span class="filter-checkbox-custom"></span>
          <span class="filter-checkbox-text">{{ m }}</span>
        </label>
        
        <!-- Phân trang chất liệu khi nhiều chất liệu -->
        <div *ngIf="totalMaterialPages > 1" class="filter-pager-row">
          <button [disabled]="materialPage === 0" (click)="materialPage = materialPage - 1">&lt;</button>
          <span>{{ materialPage + 1 }} / {{ totalMaterialPages }}</span>
          <button [disabled]="materialPage >= totalMaterialPages - 1" (click)="materialPage = materialPage + 1">&gt;</button>
        </div>
      </div>
    </div>

  </div>
</aside>
