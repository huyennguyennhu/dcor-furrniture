<aside class="sidebar-filter-wrapper">
  <div class="sidebar-filter-content">

    <!-- Top Header: Bộ lọc + Số lượng sản phẩm -->
    <div class="sidebar-header-row">
      <h3 class="sidebar-title">Bộ lọc</h3>
      <span class="product-count-text" *ngIf="productCount > 0">{{ productCount }} Sản phẩm</span>
    </div>

    <!-- 1. Danh mục chính trong database (Dùng đúng tên trong DB) -->
    <div class="filter-section section-categories">
      <h4 class="section-plain-title">Danh mục</h4>
      <div class="category-link-list">
        <button type="button" class="cat-link-btn" [class.active]="isCatActive('all')" (click)="selectCategory('all')">
          Tất cả
        </button>
        <button type="button" class="cat-link-btn" *ngFor="let cat of displayCategories"
          [class.active]="isCatActive(cat.key)" (click)="selectCategory(cat.key)">
          {{ cat.label }}
        </button>
      </div>
    </div>

    <!-- 2. Khối Phòng & Không gian -->
    <div class="filter-section" *ngIf="roomOptions.length > 0">
      <div class="filter-header" (click)="toggleExpand('room')">
        <h4>Phòng & Không gian</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['room'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['room']">
        <div class="subcategory-list">
          <label class="filter-checkbox-label" *ngFor="let opt of roomOptions">
            <input type="checkbox" class="filter-checkbox" [checked]="isItemActive('rooms', opt.slug)"
              (change)="toggleFilterItem('rooms', opt.slug)">
            <span class="filter-checkbox-custom"></span>
            <span class="filter-checkbox-text">{{ opt.name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 3. Khối Bộ sưu tập -->
    <div class="filter-section" *ngIf="collectionOptions.length > 0">
      <div class="filter-header" (click)="toggleExpand('collection')">
        <h4>Bộ sưu tập</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['collection'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['collection']">
        <div class="subcategory-list">
          <label class="filter-checkbox-label" *ngFor="let opt of collectionOptions">
            <input type="checkbox" class="filter-checkbox" [checked]="isItemActive('collections', opt.slug)"
              (change)="toggleFilterItem('collections', opt.slug)">
            <span class="filter-checkbox-custom"></span>
            <span class="filter-checkbox-text">{{ opt.name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 4. Khối Phong cách -->
    <div class="filter-section" *ngIf="styleOptions.length > 0">
      <div class="filter-header" (click)="toggleExpand('style')">
        <h4>Phong cách</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['style'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['style']">
        <div class="subcategory-list">
          <label class="filter-checkbox-label" *ngFor="let opt of styleOptions">
            <input type="checkbox" class="filter-checkbox" [checked]="isItemActive('styles', opt.slug)"
              (change)="toggleFilterItem('styles', opt.slug)">
            <span class="filter-checkbox-custom"></span>
            <span class="filter-checkbox-text">{{ opt.name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 5. Khối Chất liệu -->
    <div class="filter-section" *ngIf="materialOptions.length > 0">
      <div class="filter-header" (click)="toggleExpand('material')">
        <h4>Chất liệu</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['material'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['material']">
        <div class="subcategory-list">
          <label class="filter-checkbox-label" *ngFor="let opt of materialOptions">
            <input type="checkbox" class="filter-checkbox" [checked]="isItemActive('materials', opt.slug)"
              (change)="toggleFilterItem('materials', opt.slug)">
            <span class="filter-checkbox-custom"></span>
            <span class="filter-checkbox-text">{{ opt.name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 6. Khoảng giá (VNĐ) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('price')">
        <h4>Khoảng giá (VNĐ)</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['price'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['price']">
        <div class="price-slider-container">
          <!-- Dual Range Slider (2 phía Min và Max) -->
          <div class="dual-range-wrapper">
            <div class="slider-track-bar"></div>
            <div class="slider-range-highlight" [style.left.%]="minPercent" [style.right.%]="100 - maxPercent"></div>
            <input type="range" [min]="dynamicMinPrice" [max]="dynamicMaxPrice" [step]="priceStep" [(ngModel)]="localMinPrice"
              (input)="onMinSliderInput()" (change)="handlePriceChangeEnd()" (touchend)="handlePriceChangeEnd()"
              [style.z-index]="localMinPrice > ((dynamicMaxPrice + dynamicMinPrice) / 2) ? 5 : 3" class="range-input range-input-min"
              aria-label="Giá tối thiểu">
            <input type="range" [min]="dynamicMinPrice" [max]="dynamicMaxPrice" [step]="priceStep" [(ngModel)]="localMaxPrice"
              (input)="onMaxSliderInput()" (change)="handlePriceChangeEnd()" (touchend)="handlePriceChangeEnd()"
              [style.z-index]="localMinPrice > ((dynamicMaxPrice + dynamicMinPrice) / 2) ? 3 : 5" class="range-input range-input-max"
              aria-label="Giá tối đa">
          </div>

          <!-- Ô nhập giá thủ công 2 phía -->
          <div class="price-inputs-row">
            <div class="price-input-col">
              <label class="price-input-sublabel">Tối thiểu</label>
              <div class="price-input-box">
                <input type="text" class="price-manual-input" [value]="formatPriceOnlyNumber(localMinPrice)"
                  (focus)="onInputFocus($event)" (blur)="onMinInputBlur($event)"
                  (keydown.enter)="onMinInputEnter($event)" [placeholder]="formatPriceOnlyNumber(dynamicMinPrice)">
                <span class="price-currency-suffix">đ</span>
              </div>
            </div>

            <span class="price-sep-dash">-</span>

            <div class="price-input-col">
              <label class="price-input-sublabel">Tối đa</label>
              <div class="price-input-box">
                <input type="text" class="price-manual-input" [value]="formatPriceOnlyNumber(localMaxPrice)"
                  (focus)="onInputFocus($event)" (blur)="onMaxInputBlur($event)"
                  (keydown.enter)="onMaxInputEnter($event)" [placeholder]="formatPriceOnlyNumber(dynamicMaxPrice)">
                <span class="price-currency-suffix">đ</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 7. Đánh giá (Data thật tính từ các sản phẩm) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('rating')">
        <h4>Đánh giá</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['rating'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['rating']">
        <div class="rating-filter-row" *ngFor="let stars of [5, 4, 3, 2]" (click)="selectRating(stars)"
          [class.active]="filters.minRating === stars">
          <span class="custom-radio-circle" [class.checked]="filters.minRating === stars"></span>
          <div class="stars-visual">
            <lucide-angular *ngFor="let s of [1,2,3,4,5]" [img]="icons.Star" size="15" class="star-item"
              [class.filled]="s <= stars">
            </lucide-angular>
          </div>
          <span class="rating-count-num">{{ ratingCounts[stars] || 0 }}</span>
        </div>
      </div>
    </div>

    <!-- 8. Bảng màu sắc thật từ Database (Có phân trang) -->
    <div class="filter-section">
      <div class="filter-header" (click)="toggleExpand('color')">
        <h4>Bảng màu sắc</h4>
        <lucide-angular [img]="icons.ChevronDown" size="16"
          [ngStyle]="{'transform': expanded['color'] ? 'rotate(180deg)' : 'none', 'transition': 'transform 0.2s'}"></lucide-angular>
      </div>
      <div class="filter-body" *ngIf="expanded['color']">
        <div class="color-swatches-grid">
          <button type="button" class="swatch-circle-btn" *ngFor="let c of currentColors"
            [style.background-color]="c.hex" [class.active]="isColorActive(c.slug)" [title]="c.name"
            (click)="selectColor(c.slug)">
            <lucide-angular *ngIf="isColorActive(c.slug)" [img]="icons.Check" size="12"
              [color]="c.hex === '#F8F8F8' ? '#000' : '#fff'"></lucide-angular>
          </button>
        </div>

        <!-- Phân trang màu sắc khi nhiều màu -->
        <div *ngIf="totalColorPages > 1" class="filter-pager-row">
          <button [disabled]="colorPage === 0" (click)="colorPage = colorPage - 1">&lt;</button>
          <span>{{ colorPage + 1 }} / {{ totalColorPages }}</span>
          <button [disabled]="colorPage >= totalColorPages - 1" (click)="colorPage = colorPage + 1">&gt;</button>
        </div>
      </div>
    </div>

  </div>
</aside>
