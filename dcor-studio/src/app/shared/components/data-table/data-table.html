<div style="background: white; border-radius: 12px; border: 1px solid var(--border-color);">
  <div style="overflow-x: auto;">
    <table class="admin-table">
      <thead>
        <tr>
          <th *ngIf="expandableTemplate" style="width: 40px;"></th>
          <th *ngIf="selectable" style="width: 40px; text-align: center;">
            <label style="display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0;">
              <input type="checkbox" class="admin-checkbox"
                     [checked]="isAllSelected()"
                     (change)="toggleAllSelection($event)">
            </label>
          </th>
          <th *ngFor="let col of columns" [style.width]="col.width" [style.text-align]="col.align || 'left'">
            {{ col.header }}
          </th>
          <th *ngIf="actionsTemplate" style="width: 60px;"></th>
        </tr>
      </thead>
      
      <tbody>
        <tr *ngIf="isLoading">
          <td [attr.colspan]="columns.length + (actionsTemplate ? 1 : 0) + (selectable ? 1 : 0) + (expandableTemplate ? 1 : 0)" 
              style="padding: 40px; text-align: center; color: var(--text-muted);">
            Đang tải dữ liệu...
          </td>
        </tr>
        
        <tr *ngIf="!isLoading && paginatedData.length === 0">
          <td [attr.colspan]="columns.length + (actionsTemplate ? 1 : 0) + (selectable ? 1 : 0) + (expandableTemplate ? 1 : 0)" 
              style="padding: 40px; text-align: center; color: var(--text-muted);">
            Không có dữ liệu
          </td>
        </tr>
        
        <ng-container *ngFor="let item of paginatedData; let rIdx = index">
          <tr [style.cursor]="rowClick.observed ? 'pointer' : 'default'"
              [style.background]="expandedRows.has(rIdx) ? 'var(--bg-secondary)' : 'transparent'"
              (click)="onRowClick(item)">
            
            <td *ngIf="expandableTemplate" style="text-align: center; cursor: pointer;" (click)="toggleExpand(rIdx, $event)">
              <svg *ngIf="expandedRows.has(rIdx)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--text-muted)"><path d="m6 9 6 6 6-6"/></svg>
              <svg *ngIf="!expandedRows.has(rIdx)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--text-muted)"><path d="m9 18 6-6-6-6"/></svg>
            </td>
            
            <td *ngIf="selectable" style="text-align: center;" (click)="$event.stopPropagation()">
              <label style="display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0;">
                <input type="checkbox" class="admin-checkbox"
                       [checked]="selectedKeys.has(item[rowKey])"
                       (change)="toggleSelection(item, $event)">
              </label>
            </td>
            
            <td *ngFor="let col of columns" 
                [style.text-align]="col.align || 'left'"
                [style.white-space]="col.width === '1%' ? 'nowrap' : 'normal'"
                style="font-size: 14px; color: var(--text-primary);">
              
              <ng-container *ngIf="customCellTemplate; else defaultCell">
                <ng-container *ngTemplateOutlet="customCellTemplate; context: { $implicit: item, column: col }"></ng-container>
              </ng-container>
              <ng-template #defaultCell>
                {{ item[col.key] }}
              </ng-template>
              
            </td>
            
            <td *ngIf="actionsTemplate" style="text-align: right;" (click)="$event.stopPropagation()">
              <div style="position: relative; display: inline-block;">
                <button (click)="toggleDropdown(rIdx, $event)"
                        style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
                
                <div *ngIf="openDropdownRow === rIdx"
                     (click)="openDropdownRow = null"
                     style="position: absolute; right: 0; z-index: 50;"
                     [ngStyle]="(paginatedData.length > 3 && rIdx >= paginatedData.length - 2) ? {'bottom': '100%', 'margin-bottom': '2px'} : {'top': '100%', 'margin-top': '2px'}">
                  <ng-container *ngTemplateOutlet="actionsTemplate; context: { $implicit: item }"></ng-container>
                </div>
              </div>
            </td>
          </tr>
          
          <tr *ngIf="expandableTemplate && expandedRows.has(rIdx)">
            <td [attr.colspan]="columns.length + (actionsTemplate ? 1 : 0) + (selectable ? 1 : 0) + 1" style="padding: 0; border-bottom: 1px solid var(--border-color);">
              <div style="padding: 16px 24px; background: var(--bg-secondary); border-top: 1px solid var(--border-color);">
                <ng-container *ngTemplateOutlet="expandableTemplate; context: { $implicit: item }"></ng-container>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
  
  <div *ngIf="totalItems > 0" style="padding: 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 13px; color: var(--text-muted);">
      Hiển thị {{ paginatedData.length ? (currentPage - 1) * pageSize + 1 : 0 }} - {{ Math.min(currentPage * pageSize, totalItems) }} / {{ totalItems }}
    </span>
    
    <div style="display: flex; gap: 4px; align-items: center;">
      <ng-container *ngIf="showNavButtons">
        <button (click)="setPage(1)" [disabled]="currentPage === 1"
                class="admin-pagination-btn" [class.disabled]="currentPage === 1">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
        </button>
        <button (click)="setPage(currentPage - 1)" [disabled]="currentPage === 1"
                class="admin-pagination-btn" [class.disabled]="currentPage === 1">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </ng-container>

      <button *ngFor="let p of pages"
              (click)="setPage(p)"
              class="admin-pagination-btn" [class.active]="p === currentPage">
        {{ p }}
      </button>

      <ng-container *ngIf="showNavButtons">
        <button (click)="setPage(currentPage + 1)" [disabled]="currentPage === totalPages"
                class="admin-pagination-btn" [class.disabled]="currentPage === totalPages">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button (click)="setPage(totalPages)" [disabled]="currentPage === totalPages"
                class="admin-pagination-btn" [class.disabled]="currentPage === totalPages">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
        </button>
      </ng-container>
    </div>
  </div>
</div>
